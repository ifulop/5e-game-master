<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5e RPG Dungeon Master — Access Required</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      color: #e8e0d0;
      font-family: 'Georgia', serif;
    }
    .card {
      background: #242424;
      border: 1px solid #3a3020;
      border-radius: 8px;
      padding: 2.5rem 2rem;
      width: min(360px, 90vw);
      text-align: center;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: normal;
      margin-bottom: 0.5rem;
      color: #c8b89a;
      letter-spacing: 0.03em;
    }
    p {
      font-size: 0.85rem;
      color: #7a7060;
      margin-bottom: 1.75rem;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.9rem;
      background: #1a1a1a;
      border: 1px solid #3a3020;
      border-radius: 4px;
      color: #e8e0d0;
      font-family: inherit;
      font-size: 1rem;
      margin-bottom: 0.75rem;
      outline: none;
    }
    input[type="password"]:focus { border-color: #7a6040; }
    button {
      width: 100%;
      padding: 0.65rem;
      background: #3a2c18;
      border: 1px solid #5a4a2a;
      border-radius: 4px;
      color: #c8b89a;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    button:hover { background: #4a3820; }
    .error {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: #c05050;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>5e RPG Dungeon Master</h1>
    <p>Enter the access code to continue.</p>
    <form method="POST" action="/login">
      <input type="password" name="code" placeholder="Access code" autofocus autocomplete="off">
      <button type="submit">Enter</button>
    </form>
  </div>
</body>
</html>
