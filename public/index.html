<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5e RPG — Dungeon Master</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0e0d;
      color: #d4c9a8;
      font-family: Georgia, serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      border-bottom: 1px solid #3a3020;
      background: #1a1710;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    h1 { font-size: 1.05rem; color: #c9a84c; letter-spacing: 0.06em; }

    #phase-badge {
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 12px;
      background: #2a2518;
      color: #8a7a4a;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .msg { max-width: 740px; line-height: 1.75; }

    .msg.narrator { color: #d4c9a8; font-size: 1rem; white-space: pre-wrap; }

    .msg.player {
      color: #8a9f7a;
      font-style: italic;
      padding-left: 14px;
      border-left: 2px solid #3a5030;
    }

    .msg.system { color: #7a6a4a; font-size: 0.85rem; }

    .msg.error { color: #a06060; font-size: 0.85rem; }

    footer {
      border-top: 1px solid #3a3020;
      padding: 14px 20px;
      background: #1a1710;
      flex-shrink: 0;
    }

    #action-area { display: flex; gap: 10px; align-items: flex-end; }

    textarea {
      flex: 1;
      background: #231f15;
      border: 1px solid #4a3f28;
      color: #d4c9a8;
      font-family: Georgia, serif;
      font-size: 0.95rem;
      padding: 10px 14px;
      border-radius: 4px;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      line-height: 1.5;
    }

    textarea:focus { outline: none; border-color: #8a6a2a; }
    textarea::placeholder { color: #504535; }

    button {
      background: #5a3a10;
      color: #d4c9a8;
      border: 1px solid #8a5a20;
      padding: 10px 22px;
      font-family: Georgia, serif;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    button:hover:not(:disabled) { background: #7a4e18; }
    button:disabled { opacity: 0.35; cursor: default; }

    button.ghost {
      background: #1f1c12;
      border-color: #3a3020;
      color: #6a5a3a;
    }
    button.ghost:hover:not(:disabled) { background: #2a2518; color: #8a7a4a; }

    a.btn-download {
      display: inline-block;
      background: #1a3a1a;
      color: #8abf8a;
      border: 1px solid #2a5a2a;
      padding: 10px 22px;
      font-family: Georgia, serif;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    a.btn-download:hover { background: #223a22; }

    .thinking {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #7a6a4a;
      font-size: 0.85rem;
    }

    .dot-flash span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #8a6a2a;
      animation: flash 1.2s infinite;
    }
    .dot-flash span:nth-child(2) { animation-delay: 0.2s; }
    .dot-flash span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes flash {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>

<header>
  <h1>Dungeon Master</h1>
  <span id="phase-badge">connecting</span>
</header>

<div id="log"></div>

<footer>
  <div id="action-area"></div>
</footer>

<script>
  const logEl = document.getElementById('log');
  const actionArea = document.getElementById('action-area');
  const phaseBadge = document.getElementById('phase-badge');

  let phase = null;
  let busy = false;
  let thinkingEl = null;

  // ── DOM helpers ──────────────────────────────────────────────────────────────

  function addMsg(text, type = 'narrator') {
    removeThinking();
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function showThinking() {
    removeThinking();
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'thinking';
    thinkingEl.innerHTML = '<div class="dot-flash"><span></span><span></span><span></span></div> The Dungeon Master is writing…';
    logEl.appendChild(thinkingEl);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function removeThinking() {
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  }

  function setBusy(state) {
    busy = state;
    actionArea.querySelectorAll('button, textarea').forEach(el => el.disabled = state);
  }

  function setPhase(p) {
    phase = p;
    phaseBadge.textContent = p.replace(/_/g, ' ');
  }

  // ── API ──────────────────────────────────────────────────────────────────────

  async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(path, opts);
    const data = await res.json();
    if (!res.ok) throw Object.assign(new Error(data.message ?? 'Request failed'), { data });
    return data;
  }

  // ── Render action bar ────────────────────────────────────────────────────────

  function renderActions() {
    actionArea.innerHTML = '';

    if (phase === 'no_campaign') {
      const btn = btn_('Begin Campaign', startIntake);
      actionArea.appendChild(btn);
      return;
    }

    if (phase === 'intake') {
      const ta = textarea_('Your response…');
      ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendIntake(ta.value.trim()); } };
      const btn = btn_('Send', () => sendIntake(ta.value.trim()));
      actionArea.appendChild(ta);
      actionArea.appendChild(btn);
      ta.focus();
      return;
    }

    if (phase === 'setup_ready') {
      addMsg('All information gathered. Generate your campaign when ready.', 'system');
      actionArea.appendChild(btn_('Generate Campaign', runSetup));
      return;
    }

    if (phase === 'awaiting_scene_open') {
      actionArea.appendChild(btn_('Open Scene', openScene));
      actionArea.appendChild(btn_('Reset', confirmReset, 'ghost'));
      return;
    }

    if (phase === 'awaiting_epilogue') {
      actionArea.appendChild(btn_('Receive Epilogue', openScene));
      actionArea.appendChild(btn_('Reset', confirmReset, 'ghost'));
      return;
    }

    if (phase === 'in_progress') {
      const ta = textarea_('What do you do?');
      ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTurn(ta.value.trim()); } };
      const btn = btn_('Act', () => sendTurn(ta.value.trim()));
      actionArea.appendChild(ta);
      actionArea.appendChild(btn);
      actionArea.appendChild(btn_('Reset', confirmReset, 'ghost'));
      ta.focus();
      return;
    }

    if (phase === 'complete') {
      actionArea.appendChild(downloadLink_('Adventure Summary', '/adventure/summary', 'adventure-summary.md'));
      actionArea.appendChild(downloadLink_('Full Transcript', '/adventure/transcript', 'adventure-transcript.md'));
      actionArea.appendChild(btn_('New Campaign', confirmReset));
      return;
    }
  }

  function btn_(label, onclick, cls = '') {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.onclick = onclick;
    return b;
  }

  function downloadLink_(label, href, filename) {
    const a = document.createElement('a');
    a.href = href;
    a.download = filename;
    a.textContent = label;
    a.className = 'btn-download';
    return a;
  }

  function textarea_(placeholder) {
    const ta = document.createElement('textarea');
    ta.placeholder = placeholder;
    ta.rows = 2;
    return ta;
  }

  // ── Actions ──────────────────────────────────────────────────────────────────

  async function startIntake() {
    setBusy(true);
    showThinking();
    try {
      const data = await api('POST', '/intake');
      addMsg(data.reply, 'narrator');
      setPhase('intake');
      renderActions();
    } catch (err) {
      addMsg(`Error: ${err.message}`, 'error');
    } finally {
      setBusy(false);
    }
  }

  async function sendIntake(text) {
    if (!text || busy) return;
    addMsg(text, 'player');
    setBusy(true);
    showThinking();
    try {
      const data = await api('POST', '/intake', { message: text });
      if (data.done) {
        setPhase('setup_ready');
        renderActions();
      } else {
        addMsg(data.reply, 'narrator');
        renderActions();
      }
    } catch (err) {
      addMsg(`Error: ${err.message}`, 'error');
      renderActions();
    } finally {
      setBusy(false);
    }
  }

  async function runSetup() {
    setBusy(true);
    addMsg('Generating your campaign — this may take up to a minute…', 'system');
    showThinking();
    try {
      const data = await api('POST', '/setup');
      addMsg(data.narration, 'narrator');
      setPhase('in_progress');
      renderActions();
    } catch (err) {
      addMsg(`Error: ${err.message}`, 'error');
      setPhase('setup_ready');
      renderActions();
    } finally {
      setBusy(false);
    }
  }

  async function openScene() {
    setBusy(true);
    showThinking();
    try {
      const data = await api('POST', '/scene');
      addMsg(data.narration, 'narrator');
      setPhase(data.campaign_complete ? 'complete' : 'in_progress');
      renderActions();
    } catch (err) {
      addMsg(`Error: ${err.message}`, 'error');
      renderActions();
    } finally {
      setBusy(false);
    }
  }

  async function sendTurn(text) {
    if (!text || busy) return;
    addMsg(text, 'player');
    setBusy(true);
    showThinking();
    try {
      const data = await api('POST', '/turn', { input: text });
      addMsg(data.narration, 'narrator');
      if (data.encounter_resolved) {
          if (data.campaign_complete) {
            addMsg(`Encounter resolved (${data.resolution_type}). Receive your epilogue when ready.`, 'system');
            setPhase('awaiting_epilogue');
          } else {
            addMsg(`Encounter resolved (${data.resolution_type}). Open the next scene when ready.`, 'system');
            setPhase('awaiting_scene_open');
          }
        }
      renderActions();
    } catch (err) {
      addMsg(`Error: ${err.message}`, 'error');
      renderActions();
    } finally {
      setBusy(false);
    }
  }

  async function confirmReset() {
    if (!confirm('Archive the current campaign and start fresh?')) return;
    setBusy(true);
    try {
      await api('POST', '/reset');
      logEl.innerHTML = '';
      addMsg('Campaign archived. Start a new one when ready.', 'system');
      setPhase('no_campaign');
      renderActions();
    } catch (err) {
      addMsg(`Error: ${err.message}`, 'error');
      renderActions();
    } finally {
      setBusy(false);
    }
  }

  // ── Init ─────────────────────────────────────────────────────────────────────

  async function init() {
    try {
      const status = await api('GET', '/status');
      setPhase(status.phase);

      if (status.phase === 'no_campaign') {
        addMsg('No campaign in progress. Begin one when ready.', 'system');
      } else if (status.phase === 'intake') {
        addMsg(`Intake in progress (${status.turn} turn${status.turn !== 1 ? 's' : ''} so far). Continue below.`, 'system');
      } else if (status.phase === 'awaiting_scene_open') {
        addMsg('Campaign generated. Open the first scene when ready.', 'system');
      } else if (status.phase === 'in_progress') {
        addMsg(`Encounter ${status.encounter_id} — turn ${status.turn_count}. Enter your action below.`, 'system');
      } else if (status.phase === 'complete') {
        addMsg('Campaign complete.', 'system');
      }

      renderActions();
    } catch (err) {
      phaseBadge.textContent = 'offline';
      addMsg('Could not connect to the server. Is it running?', 'error');
    }
  }

  init();
</script>
</body>
</html>
