<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5e RPG — Dungeon Master</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0e0d;
      color: #d4c9a8;
      font-family: Georgia, serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      border-bottom: 1px solid #3a3020;
      background: #1a1710;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    h1 { font-size: 1.05rem; color: #c9a84c; letter-spacing: 0.06em; }

    #phase-badge {
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 12px;
      background: #2a2518;
      color: #8a7a4a;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .msg { max-width: 740px; line-height: 1.75; }

    .msg.narrator { color: #d4c9a8; font-size: 1rem; white-space: pre-wrap; }

    .msg.player {
      color: #8a9f7a;
      font-style: italic;
      padding-left: 14px;
      border-left: 2px solid #3a5030;
    }

    .msg.system { color: #7a6a4a; font-size: 0.85rem; }

    .msg.error { color: #a06060; font-size: 0.85rem; }

    footer {
      border-top: 1px solid #3a3020;
      padding: 14px 20px;
      background: #1a1710;
      flex-shrink: 0;
    }

    #action-area { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }

    textarea {
      flex: 1;
      background: #231f15;
      border: 1px solid #4a3f28;
      color: #d4c9a8;
      font-family: Georgia, serif;
      font-size: 0.95rem;
      padding: 10px 14px;
      border-radius: 4px;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      line-height: 1.5;
      min-width: 0;
    }

    textarea:focus { outline: none; border-color: #8a6a2a; }
    textarea::placeholder { color: #504535; }

    button {
      background: #5a3a10;
      color: #d4c9a8;
      border: 1px solid #8a5a20;
      padding: 10px 22px;
      font-family: Georgia, serif;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    button:hover:not(:disabled) { background: #7a4e18; }
    button:disabled { opacity: 0.35; cursor: default; }

    button.ghost {
      background: #1f1c12;
      border-color: #3a3020;
      color: #6a5a3a;
    }
    button.ghost:hover:not(:disabled) { background: #2a2518; color: #8a7a4a; }

    a.btn-download {
      display: inline-block;
      background: #1a3a1a;
      color: #8abf8a;
      border: 1px solid #2a5a2a;
      padding: 10px 22px;
      font-family: Georgia, serif;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    a.btn-download:hover { background: #223a22; }

    .thinking {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #7a6a4a;
      font-size: 0.85rem;
    }

    .dot-flash span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #8a6a2a;
      animation: flash 1.2s infinite;
    }
    .dot-flash span:nth-child(2) { animation-delay: 0.2s; }
    .dot-flash span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes flash {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    /* Campaign list panel */
    #campaign-panel {
      display: none;
      max-width: 740px;
      margin-top: 8px;
      border: 1px solid #3a3020;
      border-radius: 4px;
      background: #181510;
      overflow: hidden;
    }

    #campaign-panel.open { display: block; }

    .campaign-list-header {
      padding: 10px 16px;
      font-size: 0.8rem;
      color: #7a6a4a;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid #2a2518;
    }

    .campaign-item {
      padding: 12px 16px;
      border-bottom: 1px solid #1f1c12;
      cursor: pointer;
      transition: background 0.12s;
    }
    .campaign-item:last-child { border-bottom: none; }
    .campaign-item:hover { background: #221e14; }

    .campaign-item-name {
      font-size: 0.95rem;
      color: #c9a84c;
      margin-bottom: 4px;
    }

    .campaign-item-meta {
      font-size: 0.78rem;
      color: #6a5a3a;
    }

    /* Welcome-back card */
    .welcome-card {
      max-width: 540px;
      border: 1px solid #3a3020;
      border-radius: 6px;
      background: #181510;
      padding: 20px 24px;
    }

    .welcome-card h2 {
      font-size: 1rem;
      color: #c9a84c;
      margin-bottom: 12px;
    }

    .welcome-card p {
      font-size: 0.9rem;
      color: #a09070;
      line-height: 1.6;
      margin-bottom: 6px;
    }

    .welcome-card-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    /* Toast */
    #toast-container {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 999;
    }

    .toast {
      background: #2a3a22;
      border: 1px solid #3a5a2a;
      color: #8abf8a;
      padding: 8px 20px;
      border-radius: 20px;
      font-family: Georgia, serif;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .toast.visible { opacity: 1; }

    /* Intake form */
    .intake-form {
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .intake-section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #7a6a4a;
      margin-bottom: 14px;
    }

    .character-slot {
      border: 1px solid #2a2518;
      border-radius: 6px;
      padding: 16px 18px;
      background: #141210;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .character-slot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .character-slot-label {
      font-size: 0.8rem;
      color: #8a7a4a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .remove-char-btn {
      background: none;
      border: none;
      color: #5a4a2a;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 2px 6px;
    }
    .remove-char-btn:hover { color: #a06060; }

    .field-group { display: flex; flex-direction: column; gap: 6px; }

    .field-label {
      font-size: 0.78rem;
      color: #7a6a4a;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background: #1f1c12;
      border: 1px solid #3a3020;
      color: #8a7a4a;
      padding: 4px 12px;
      border-radius: 14px;
      font-family: Georgia, serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      white-space: nowrap;
    }
    .chip:hover { background: #2a2518; color: #b09060; }
    .chip.active {
      background: #3a2e10;
      border-color: #8a6a2a;
      color: #c9a84c;
    }

    .field-input {
      background: #1a1710;
      border: 1px solid #3a3020;
      color: #d4c9a8;
      font-family: Georgia, serif;
      font-size: 0.88rem;
      padding: 7px 11px;
      border-radius: 4px;
      width: 100%;
      display: none;
    }
    .field-input.visible { display: block; }
    .field-input:focus { outline: none; border-color: #6a5020; }
    .field-input::placeholder { color: #4a3f28; }

    .name-input {
      background: #1a1710;
      border: 1px solid #3a3020;
      color: #d4c9a8;
      font-family: Georgia, serif;
      font-size: 0.88rem;
      padding: 7px 11px;
      border-radius: 4px;
      width: 100%;
    }
    .name-input:focus { outline: none; border-color: #6a5020; }
    .name-input::placeholder { color: #4a3f28; }

    .add-char-row { display: flex; }
  </style>
</head>
<body>

<header>
  <h1>Dungeon Master</h1>
  <span id="phase-badge">connecting</span>
</header>

<div id="log"></div>

<div id="toast-container"></div>

<footer>
  <div id="action-area"></div>
  <div id="campaign-panel">
    <div class="campaign-list-header">Saved Campaigns</div>
    <div id="campaign-list"></div>
  </div>
</footer>

<script>
  const logEl = document.getElementById('log');
  const actionArea = document.getElementById('action-area');
  const phaseBadge = document.getElementById('phase-badge');
  const campaignPanel = document.getElementById('campaign-panel');
  const campaignList = document.getElementById('campaign-list');
  const toastContainer = document.getElementById('toast-container');

  let phase = null;
  let busy = false;
  let thinkingEl = null;

  // ── Toast ─────────────────────────────────────────────────────────────────────

  function showToast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    toastContainer.innerHTML = '';
    toastContainer.appendChild(el);
    requestAnimationFrame(() => {
      el.classList.add('visible');
      setTimeout(() => {
        el.classList.remove('visible');
        setTimeout(() => el.remove(), 200);
      }, 1500);
    });
  }

  // ── DOM helpers ───────────────────────────────────────────────────────────────

  function addMsg(text, type = 'narrator') {
    removeThinking();
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function showThinking() {
    removeThinking();
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'thinking';
    thinkingEl.innerHTML = '<div class="dot-flash"><span></span><span></span><span></span></div> The Dungeon Master is writing…';
    logEl.appendChild(thinkingEl);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function removeThinking() {
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  }

  function setBusy(state) {
    busy = state;
    actionArea.querySelectorAll('button, textarea').forEach(el => el.disabled = state);
  }

  function setPhase(p) {
    phase = p;
    phaseBadge.textContent = p.replace(/_/g, ' ');
  }

  // ── API ───────────────────────────────────────────────────────────────────────

  async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(path, opts);
    const data = await res.json();
    if (!res.ok) throw Object.assign(new Error(data.message ?? 'Request failed'), { data });
    return data;
  }

  // ── Campaign list panel ───────────────────────────────────────────────────────

  async function loadCampaignPanel() {
    let campaigns = [];
    try { campaigns = await api('GET', '/campaigns'); } catch { return; }
    if (!campaigns.length) return;

    campaignList.innerHTML = '';
    for (const c of campaigns) {
      const item = document.createElement('div');
      item.className = 'campaign-item';

      const name = document.createElement('div');
      name.className = 'campaign-item-name';
      name.textContent = c.name ?? 'Unnamed Campaign';

      const meta = document.createElement('div');
      meta.className = 'campaign-item-meta';
      const party = Array.isArray(c.party) ? c.party.join(', ') : '';
      const progress = c.total_encounters
        ? `Encounter ${(c.encounter_index ?? 0) + 1} of ${c.total_encounters}`
        : '';
      const savedDate = c.saved_at ? new Date(c.saved_at).toLocaleDateString() : '';
      meta.textContent = [party, progress, savedDate ? `Saved ${savedDate}` : ''].filter(Boolean).join(' · ');

      item.appendChild(name);
      item.appendChild(meta);
      item.onclick = () => loadCampaign(c.id);
      campaignList.appendChild(item);
    }

    campaignPanel.classList.add('open');
  }

  function hideCampaignPanel() {
    campaignPanel.classList.remove('open');
  }

  // ── Render action bar ─────────────────────────────────────────────────────────

  function renderActions(statusData) {
    actionArea.innerHTML = '';
    hideCampaignPanel();

    if (phase === 'no_campaign') {
      actionArea.appendChild(btn_('New Campaign', beginNewCampaign));
      actionArea.appendChild(btn_('Continue a Campaign', toggleCampaignPanel, 'ghost'));
      return;
    }

    if (phase === 'intake_form') {
      actionArea.appendChild(btn_('Review My Adventure', submitIntakeForm));
      return;
    }

    if (phase === 'intake_review') {
      const ta = textarea_('Any additional details about your characters? (relationships, quirks, backstory moments…)');
      ta.style.minHeight = '60px';
      const sendBtn = btn_('Add Details', () => sendIntakeDetails(ta.value.trim()));
      const skipBtn = btn_('Generate Campaign', skipIntakeDetails, 'ghost');
      actionArea.appendChild(ta);
      actionArea.appendChild(sendBtn);
      actionArea.appendChild(skipBtn);
      ta.focus();
      return;
    }

    if (phase === 'setup_ready') {
      actionArea.appendChild(btn_('Generate Campaign', runSetup));
      return;
    }

    if (phase === 'awaiting_scene_open') {
      actionArea.appendChild(btn_('Open Scene', openScene));
      actionArea.appendChild(btn_('Save & Continue', saveAndContinue, 'ghost'));
      actionArea.appendChild(btn_('Save & Quit', saveAndQuit, 'ghost'));
      actionArea.appendChild(btn_('Reset', confirmReset, 'ghost'));
      return;
    }

    if (phase === 'awaiting_epilogue') {
      actionArea.appendChild(btn_('Receive Epilogue', openScene));
      actionArea.appendChild(btn_('Save & Quit', saveAndQuit, 'ghost'));
      actionArea.appendChild(btn_('Reset', confirmReset, 'ghost'));
      return;
    }

    if (phase === 'in_progress') {
      const ta = textarea_('What do you do?');
      ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTurn(ta.value.trim()); } };
      const btn = btn_('Act', () => sendTurn(ta.value.trim()));
      actionArea.appendChild(ta);
      actionArea.appendChild(btn);
      actionArea.appendChild(btn_('Save', doSave, 'ghost'));
      actionArea.appendChild(btn_('Save & Quit', saveAndQuit, 'ghost'));
      actionArea.appendChild(btn_('Reset', confirmReset, 'ghost'));
      ta.focus();
      return;
    }

    if (phase === 'complete') {
      actionArea.appendChild(downloadLink_('Adventure Summary', '/adventure/summary', 'adventure-summary.md'));
      actionArea.appendChild(downloadLink_('Full Transcript', '/adventure/transcript', 'adventure-transcript.md'));
      actionArea.appendChild(btn_('New Campaign', confirmReset));
      return;
    }

    if (phase === 'welcome_back') {
      return; // welcome-back card handles its own buttons
    }
  }

  function btn_(label, onclick, cls = '') {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.onclick = onclick;
    return b;
  }

  function downloadLink_(label, href, filename) {
    const a = document.createElement('a');
    a.href = href;
    a.download = filename;
    a.textContent = label;
    a.className = 'btn-download';
    return a;
  }

  function textarea_(placeholder) {
    const ta = document.createElement('textarea');
    ta.placeholder = placeholder;
    ta.rows = 2;
    return ta;
  }

  // ── Welcome-back screen ───────────────────────────────────────────────────────

  function showWelcomeBack(status) {
    setPhase('welcome_back');
    phaseBadge.textContent = status.phase.replace(/_/g, ' ');

    const card = document.createElement('div');
    card.className = 'welcome-card msg';

    const h2 = document.createElement('h2');
    h2.textContent = 'Welcome back.';
    card.appendChild(h2);

    const name = status.save_name ?? 'Campaign';
    const enc = status.encounter_index != null && status.total_encounters
      ? `Encounter ${status.encounter_index + 1} of ${status.total_encounters}`
      : '';
    const turn = status.turn_count != null ? `Turn ${status.turn_count}` : '';
    const party = Array.isArray(status.party) ? status.party.join(', ') : '';
    const saved = status.saved_at ? new Date(status.saved_at).toLocaleDateString() : '';

    const p1 = document.createElement('p');
    p1.textContent = [name, enc, turn].filter(Boolean).join(' — ');
    card.appendChild(p1);

    if (party || saved) {
      const p2 = document.createElement('p');
      p2.textContent = [party ? `Party: ${party}` : '', saved ? `Last saved: ${saved}` : ''].filter(Boolean).join(' · ');
      card.appendChild(p2);
    }

    const actions = document.createElement('div');
    actions.className = 'welcome-card-actions';

    const continueBtn = btn_('Continue', () => {
      card.remove();
      setPhase(status.phase);
      renderActions(status);
    });
    actions.appendChild(continueBtn);

    const switchBtn = btn_('Switch Campaign', () => {
      card.remove();
      setPhase('no_campaign');
      renderActions();
      toggleCampaignPanel();
    }, 'ghost');
    actions.appendChild(switchBtn);

    card.appendChild(actions);
    logEl.appendChild(card);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ── Campaign panel toggle ─────────────────────────────────────────────────────

  function toggleCampaignPanel() {
    if (campaignPanel.classList.contains('open')) {
      hideCampaignPanel();
    } else {
      loadCampaignPanel();
    }
  }

  // ── Intake form ───────────────────────────────────────────────────────────────

  const CHAR_PRESETS = {
    class: ['Fighter', 'Rogue', 'Wizard'],
    personality: ['Bold and brash', 'Cautious and calculating', 'Warm and empathetic'],
    backstory_hook: ['Fleeing a troubled past', 'Seeking redemption', 'Chasing a lost family member'],
    playstyle_notes: ['I prefer direct action', 'I like to plan and scheme', 'I enjoy talking my way through problems'],
  };

  const PREF_PRESETS = {
    tone: { options: ['Dark and gritty', 'Heroic and epic', 'Whimsical and lighthearted'], custom: true },
    primary_goal: { options: ['Uncover a conspiracy', 'Rescue a captive', 'Explore ancient ruins'], custom: true },
    time_available: { options: ['1–2 hours', '3–4 hours', '5+ hours'], custom: false },
    combat_style: { options: ['Mostly combat', 'Balanced', 'Mostly roleplay'], custom: false },
    problem_solving: { options: ['Through combat', 'Through investigation and social', 'Mix of both'], custom: true },
    content_limits: { options: ['No graphic violence', 'No horror', 'No dark themes'], custom: true },
  };

  const COMBAT_RATIO_MAP = { 'Mostly combat': 0.7, 'Balanced': 0.4, 'Mostly roleplay': 0.2 };

  let intakeFormEl = null;

  function makeChipField(fieldKey, presets, allowCustom, placeholder = '') {
    const wrapper = document.createElement('div');
    wrapper.className = 'field-group';

    const chipRow = document.createElement('div');
    chipRow.className = 'chip-row';

    const textInput = document.createElement('input');
    textInput.type = 'text';
    textInput.className = 'field-input';
    textInput.placeholder = placeholder || `Custom ${fieldKey}…`;
    textInput.dataset.field = fieldKey;

    let activeChip = null;

    function selectChip(chip, value) {
      if (activeChip) activeChip.classList.remove('active');
      chip.classList.add('active');
      activeChip = chip;
      textInput.classList.remove('visible');
      textInput.value = value;
      textInput.dataset.selectedValue = value;
    }

    for (const opt of presets) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = opt;
      chip.onclick = () => selectChip(chip, opt);
      chipRow.appendChild(chip);
    }

    if (allowCustom) {
      const customChip = document.createElement('button');
      customChip.type = 'button';
      customChip.className = 'chip';
      customChip.textContent = 'Custom…';
      customChip.onclick = () => {
        if (activeChip) activeChip.classList.remove('active');
        customChip.classList.add('active');
        activeChip = customChip;
        textInput.dataset.selectedValue = '';
        textInput.classList.add('visible');
        textInput.focus();
      };
      chipRow.appendChild(customChip);
    }

    textInput.oninput = () => { textInput.dataset.selectedValue = textInput.value; };

    wrapper.appendChild(chipRow);
    wrapper.appendChild(textInput);
    wrapper.dataset.fieldKey = fieldKey;

    wrapper.getValue = () => textInput.dataset.selectedValue || null;
    return wrapper;
  }

  function makeCharacterSlot(index) {
    const slot = document.createElement('div');
    slot.className = 'character-slot';

    const header = document.createElement('div');
    header.className = 'character-slot-header';
    const label = document.createElement('span');
    label.className = 'character-slot-label';
    label.textContent = `Character ${index + 1}`;
    header.appendChild(label);
    if (index > 0) {
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'remove-char-btn';
      removeBtn.textContent = 'Remove';
      removeBtn.onclick = () => { slot.remove(); renumberSlots(); };
      header.appendChild(removeBtn);
    }
    slot.appendChild(header);

    // Name (free text)
    const nameGroup = document.createElement('div');
    nameGroup.className = 'field-group';
    const nameLabel = document.createElement('div');
    nameLabel.className = 'field-label';
    nameLabel.textContent = 'Name';
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'name-input';
    nameInput.placeholder = 'Character name…';
    nameInput.dataset.field = 'name';
    nameGroup.appendChild(nameLabel);
    nameGroup.appendChild(nameInput);
    slot.appendChild(nameGroup);

    const charFields = [
      { key: 'class', label: 'Class' },
      { key: 'personality', label: 'Personality' },
      { key: 'backstory_hook', label: 'Backstory Hook' },
      { key: 'playstyle_notes', label: 'Playstyle' },
    ];

    for (const { key, label } of charFields) {
      const group = makeChipField(key, CHAR_PRESETS[key], true);
      const lbl = document.createElement('div');
      lbl.className = 'field-label';
      lbl.textContent = label;
      group.insertBefore(lbl, group.firstChild);
      slot.appendChild(group);
    }

    slot.getName = () => nameInput.value.trim();
    slot.getValues = () => {
      const vals = { name: nameInput.value.trim() };
      slot.querySelectorAll('[data-field-key]').forEach(g => {
        vals[g.dataset.fieldKey] = g.getValue() ?? '';
      });
      return vals;
    };

    return slot;
  }

  function renumberSlots() {
    if (!intakeFormEl) return;
    intakeFormEl.querySelectorAll('.character-slot').forEach((slot, i) => {
      const label = slot.querySelector('.character-slot-label');
      if (label) label.textContent = `Character ${i + 1}`;
    });
  }

  function renderIntakeForm() {
    intakeFormEl = document.createElement('div');
    intakeFormEl.className = 'intake-form msg';

    // Party section
    const partyTitle = document.createElement('div');
    partyTitle.className = 'intake-section-title';
    partyTitle.textContent = 'Your Party';
    intakeFormEl.appendChild(partyTitle);

    const slotsContainer = document.createElement('div');
    slotsContainer.id = 'character-slots';
    slotsContainer.style.display = 'flex';
    slotsContainer.style.flexDirection = 'column';
    slotsContainer.style.gap = '12px';
    slotsContainer.appendChild(makeCharacterSlot(0));
    intakeFormEl.appendChild(slotsContainer);

    const addRow = document.createElement('div');
    addRow.className = 'add-char-row';
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'ghost';
    addBtn.textContent = '+ Add Character';
    addBtn.style.cssText = 'background:#1f1c12;border:1px solid #3a3020;color:#6a5a3a;padding:7px 16px;font-family:Georgia,serif;font-size:0.85rem;border-radius:4px;cursor:pointer;';
    addBtn.onclick = () => {
      const slots = slotsContainer.querySelectorAll('.character-slot');
      if (slots.length >= 4) return;
      slotsContainer.appendChild(makeCharacterSlot(slots.length));
      if (slots.length + 1 >= 4) addBtn.disabled = true;
    };
    addRow.appendChild(addBtn);
    intakeFormEl.appendChild(addRow);

    // Preferences section
    const prefTitle = document.createElement('div');
    prefTitle.className = 'intake-section-title';
    prefTitle.textContent = 'Campaign Preferences';
    intakeFormEl.appendChild(prefTitle);

    const prefFields = [
      { key: 'tone', label: 'Tone' },
      { key: 'primary_goal', label: 'Primary Goal' },
      { key: 'time_available', label: 'Session Length' },
      { key: 'combat_style', label: 'Combat Style' },
      { key: 'problem_solving', label: 'Problem-Solving Style' },
      { key: 'content_limits', label: 'Content Limits' },
    ];

    const prefContainer = document.createElement('div');
    prefContainer.id = 'pref-fields';
    prefContainer.style.display = 'flex';
    prefContainer.style.flexDirection = 'column';
    prefContainer.style.gap = '14px';

    for (const { key, label } of prefFields) {
      const cfg = PREF_PRESETS[key];
      const group = makeChipField(key, cfg.options, cfg.custom, `Custom ${label.toLowerCase()}…`);
      const lbl = document.createElement('div');
      lbl.className = 'field-label';
      lbl.textContent = label;
      group.insertBefore(lbl, group.firstChild);
      prefContainer.appendChild(group);
    }
    intakeFormEl.appendChild(prefContainer);

    logEl.appendChild(intakeFormEl);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function collectIntakeFormData() {
    const slots = intakeFormEl.querySelectorAll('.character-slot');
    const party = [];
    for (const slot of slots) {
      const vals = slot.getValues();
      if (!vals.name) continue;
      party.push({
        name: vals.name,
        class: vals.class || '',
        personality: vals.personality || '',
        backstory_hook: vals.backstory_hook || '',
        playstyle_notes: vals.playstyle_notes || '',
      });
    }

    const prefEls = intakeFormEl.querySelectorAll('#pref-fields [data-field-key]');
    const prefMap = {};
    for (const el of prefEls) {
      prefMap[el.dataset.fieldKey] = el.getValue() ?? '';
    }

    const preferences = {
      tone: prefMap.tone || '',
      primary_goal: prefMap.primary_goal || '',
      time_available: prefMap.time_available || '',
      combat_ratio: COMBAT_RATIO_MAP[prefMap.combat_style] ?? 0.4,
      problem_solving_preference: prefMap.problem_solving || '',
      content_limits: prefMap.content_limits
        ? prefMap.content_limits.split(',').map(s => s.trim()).filter(Boolean)
        : [],
    };

    return { party, preferences };
  }

  function validateFormData(data) {
    if (!data.party.length) return 'Add at least one character before continuing.';
    for (const p of data.party) {
      if (!p.name) return 'Each character must have a name.';
      if (!p.class) return 'Each character must have a class selected.';
    }
    if (!data.preferences.time_available) return 'Select a session length.';
    if (!data.preferences.combat_ratio) return 'Select a combat style.';
    return null;
  }

  async function submitIntakeForm() {
    if (busy) return;
    const data = collectIntakeFormData();
    const err = validateFormData(data);
    if (err) { addMsg(err, 'error'); return; }

    setBusy(true);
    showThinking();
    try {
      const result = await api('POST', '/intake', data);
      addMsg(result.reply, 'narrator');
      setPhase('intake_review');
      renderActions();
    } catch (e) {
      addMsg(`Error: ${e.message}`, 'error');
      renderActions();
    } finally {
      setBusy(false);
    }
  }

  async function sendIntakeDetails(text) {
    if (!text || busy) return;
    addMsg(text, 'player');
    setBusy(true);
    showThinking();
    try {
      await api('POST', '/intake', { additional: text });
      addMsg('All set. Generate your campaign when ready.', 'system');
      setPhase('setup_ready');
      renderActions();
    } catch (e) {
      addMsg(`Error: ${e.message}`, 'error');
      renderActions();
    } finally {
      setBusy(false);
    }
  }

  async function skipIntakeDetails() {
    if (busy) return;
    setBusy(true);
    showThinking();
    try {
      await api('POST', '/intake', { skip: true });
    } catch (e) {
      addMsg(`Error: ${e.message}`, 'error');
      renderActions();
      setBusy(false);
      return;
    }
    setBusy(false);
    // Proceed directly to campaign generation
    await runSetup();
  }

  // ── Actions ───────────────────────────────────────────────────────────────────

  function beginNewCampaign() {
    hideCampaignPanel();
    logEl.innerHTML = '';
    intakeFormEl = null;
    setPhase('intake_form');
    renderIntakeForm();
    renderActions();
  }

  async function runSetup() {
    setBusy(true);
    addMsg('Generating your campaign — this may take up to a minute…', 'system');
    showThinking();
    try {
      const data = await api('POST', '/setup');
      addMsg(data.narration, 'narrator');
      setPhase('in_progress');
      renderActions();
    } catch (err) {
      addMsg(`Error: ${err.message}`, 'error');
      setPhase('setup_ready');
      renderActions();
    } finally {
      setBusy(false);
    }
  }

  async function openScene() {
    setBusy(true);
    showThinking();
    try {
      const data = await api('POST', '/scene');
      addMsg(data.narration, 'narrator');
      if (data.campaign_complete) {
        addMsg('Your adventure has been saved.', 'system');
        setPhase('complete');
      } else {
        setPhase('in_progress');
      }
      renderActions();
    } catch (err) {
      addMsg(`Error: ${err.message}`, 'error');
      renderActions();
    } finally {
      setBusy(false);
    }
  }

  async function sendTurn(text) {
    if (!text || busy) return;
    addMsg(text, 'player');
    setBusy(true);
    showThinking();
    try {
      const data = await api('POST', '/turn', { input: text });
      addMsg(data.narration, 'narrator');
      if (data.encounter_resolved) {
        if (data.campaign_complete) {
          addMsg(`Encounter resolved (${data.resolution_type}). Receive your epilogue when ready.`, 'system');
          setPhase('awaiting_epilogue');
        } else {
          addMsg(`Encounter resolved (${data.resolution_type}). Open the next scene when ready.`, 'system');
          setPhase('awaiting_scene_open');
        }
      }
      renderActions();
    } catch (err) {
      addMsg(`Error: ${err.message}`, 'error');
      renderActions();
    } finally {
      setBusy(false);
    }
  }

  async function doSave() {
    if (busy) return;
    setBusy(true);
    try {
      await api('POST', '/save');
      showToast('Saved ✓');
    } catch (err) {
      addMsg(`Error saving: ${err.message}`, 'error');
    } finally {
      setBusy(false);
    }
  }

  async function saveAndContinue() {
    if (busy) return;
    setBusy(true);
    try {
      await api('POST', '/save');
      showToast('Saved ✓');
    } catch (err) {
      addMsg(`Error saving: ${err.message}`, 'error');
    } finally {
      setBusy(false);
    }
    // Proceed into open scene
    await openScene();
  }

  async function saveAndQuit() {
    if (busy) return;
    setBusy(true);
    try {
      await api('POST', '/save', { quit: true });
    } catch (err) {
      addMsg(`Error saving: ${err.message}`, 'error');
      setBusy(false);
      return;
    }
    setBusy(false);

    // Transition to welcome-back screen without reloading status
    logEl.innerHTML = '';
    addMsg('Campaign saved. Return whenever you’re ready.', 'system');
    setPhase('no_campaign');
    renderActions();
    // Pre-load the campaign panel so they can see saved campaigns
    loadCampaignPanel();
  }

  async function loadCampaign(id) {
    hideCampaignPanel();
    setBusy(true);
    showThinking();
    try {
      const data = await api('POST', `/campaigns/${id}/load`);
      removeThinking();
      logEl.innerHTML = '';

      // Fetch full status to get save_name, party, turn etc.
      const status = await api('GET', '/status');
      status.phase = data.phase; // use phase from load response
      setPhase(data.phase);

      if (status.saved_at) {
        showWelcomeBack(status);
      } else {
        addMsg(`Resumed campaign. ${data.phase === 'in_progress' ? 'Enter your action below.' : 'Open the scene when ready.'}`, 'system');
        renderActions(status);
      }
    } catch (err) {
      removeThinking();
      addMsg(`Error: ${err.message}`, 'error');
      renderActions();
    } finally {
      setBusy(false);
    }
  }

  async function confirmReset() {
    if (!confirm('Abandon the current campaign and start fresh?')) return;
    setBusy(true);
    try {
      await api('POST', '/reset');
      logEl.innerHTML = '';
      addMsg('Campaign abandoned. Start a new one when ready.', 'system');
      setPhase('no_campaign');
      renderActions();
    } catch (err) {
      addMsg(`Error: ${err.message}`, 'error');
      renderActions();
    } finally {
      setBusy(false);
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────────

  async function init() {
    try {
      const status = await api('GET', '/status');
      setPhase(status.phase);

      if (status.phase === 'no_campaign') {
        addMsg('No campaign in progress. Begin one when ready.', 'system');
        renderActions();
        loadCampaignPanel();
        return;
      }

      if (status.phase === 'intake') {
        if (status.intakeStep === 'review') {
          addMsg('Character review in progress. Add any extra details or generate your campaign.', 'system');
          setPhase('intake_review');
        } else {
          addMsg('Character creation in progress. Fill in your party details below.', 'system');
          setPhase('intake_form');
          renderIntakeForm();
        }
        renderActions(status);
        return;
      }

      // If there's a saved_at, show welcome-back screen instead of jumping straight in
      if (status.saved_at) {
        showWelcomeBack(status);
        return;
      }

      if (status.phase === 'awaiting_scene_open') {
        addMsg('Campaign generated. Open the first scene when ready.', 'system');
      } else if (status.phase === 'in_progress') {
        addMsg(`Encounter ${status.encounter_id} — turn ${status.turn_count}. Enter your action below.`, 'system');
      } else if (status.phase === 'complete') {
        addMsg('Campaign complete.', 'system');
      }

      renderActions(status);
    } catch (err) {
      phaseBadge.textContent = 'offline';
      addMsg('Could not connect to the server. Is it running?', 'error');
    }
  }

  init();
</script>
</body>
</html>
