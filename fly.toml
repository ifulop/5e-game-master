# fly.toml app configuration file generated for dungeon-master on 2026-05-26T00:50:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dungeon-master'
primary_region = 'ord'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'campaigns_data'
  destination = '/data/campaigns'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
